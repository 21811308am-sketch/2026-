<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>試験対策ポータル</title>
<style>
:root {
  --bg: #f5f7fa;
  --card: #ffffff;
  --text: #1c2733;
  --sub: #5b6b7b;
  --border: #dde3ea;
  --accent: #1f6feb;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12171d;
    --card: #1b232c;
    --text: #e8edf2;
    --sub: #9aa8b6;
    --border: #2b3640;
    --accent: #5aa2ff;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { height: 100%; }
body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Noto Sans JP", Meiryo, sans-serif;
  line-height: 1.6;
}
main {
  max-width: 560px;
  margin: 0 auto;
  padding: 40px 20px 56px;
}
h1 { font-size: 1.5rem; margin: 0 0 4px; }
.lead { color: var(--sub); margin: 0 0 28px; font-size: 0.95rem; }
.list { display: grid; gap: 14px; }
a.card {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 20px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  color: inherit;
  text-decoration: none;
  transition: border-color .15s, transform .15s;
}
a.card:hover, a.card:focus-visible { border-color: var(--accent); transform: translateY(-2px); outline: none; }
.icon { font-size: 2rem; flex: none; }
.body { flex: 1; min-width: 0; }
.title { font-size: 1.15rem; font-weight: 700; }
.desc { font-size: 0.85rem; color: var(--sub); }
.arrow { color: var(--accent); font-size: 1.4rem; flex: none; }
</style>
</head>
<body>
<main>
  <h1>試験対策ポータル</h1>
  <p class="lead">学びたい項目を選んでください。</p>
  <div class="list">
    <a class="card" href="https://21811308am-sketch.github.io/shikentaisaku/" target="_blank" rel="noopener">
      <span class="icon">📘</span>
      <span class="body"><span class="title">商品対策</span><br><span class="desc">商品概要の問題集</span></span>
      <span class="arrow">›</span>
    </a>
    <a class="card" href="https://21811308am-sketch.github.io/gyomu/" target="_blank" rel="noopener">
      <span class="icon">📗</span>
      <span class="body"><span class="title">業務方法</span><br><span class="desc">業務方法書の問題集</span></span>
      <span class="arrow">›</span>
    </a>
    <a class="card" href="https://21811308am-sketch.github.io/report2026/" target="_blank" rel="noopener">
      <span class="icon">📙</span>
      <span class="body"><span class="title">たましんレポート</span><br><span class="desc">たましんレポート2026の問題集</span></span>
      <span class="arrow">›</span>
    </a>
  </div>
</main>
</body>
</html>
